worker_processes  1;
daemon off;
pid nginx.pid;
error_log /dev/stderr debug;

events {
    worker_connections  1024;
}

http {
    tcp_save_syn on;
    log_format basic '$remote_addr ja3: $http_ssl_ja3 ja4: $http_ssl_ja4 ja4_r: $http_ssl_ja4_r greased: $http_ssl_greased alpn: $http_ssl_alpn quic: $quic_version h2fp: $http2_fingerprint h3fp: $http3_fingerprint';
    server {
        listen                 0.0.0.0:4433 ssl;
        listen                 127.0.0.1:4435;
        listen                 0.0.0.0:4434 quic reuseport;
        http2                  on;
        quic_retry             on;
        access_log             /dev/stdout basic;
