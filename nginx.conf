    tcp_save_syn on;
    log_format basic '$remote_addr ja3: $stream_ssl_ja3 greased: $stream_ssl_greased';
    server {
        listen                 0.0.0.0:4443 ssl;
        access_log             /dev/stdout basic;
        ssl_verify_client      optional_no_ca;
