name: nginx

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openssl: [openssl-3.5.6, openssl-3.5.9, openssl-4.0.3]
        nginx: [release-1.30.5, release-1.31.4, release-1.31.6]
    env:
      OPENSSL_VERSION: ${{ matrix.openssl }}
      NGINX_VERSION: ${{ matrix.nginx }}
    steps:
      - name: Dependency
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libpcre2-dev
          python3 -m pip install aioquic==1.3.0 'httpx[http2]==0.28.1' h2==4.4.1
      - uses: actions/checkout@v7
        with:
          path: nginx-ssl-fingerprint
      - name: Clone dependencies
        run: |
          git clone -b "$OPENSSL_VERSION" --depth=1 https://github.com/openssl/openssl
          git clone -b "$NGINX_VERSION" --depth=1 https://github.com/nginx/nginx
      - name: Patch
        run: |
          patch -p1 -d openssl < "nginx-ssl-fingerprint/patches/$OPENSSL_VERSION.patch"
          patch --batch --fuzz=0 -p1 -d nginx < "nginx-ssl-fingerprint/patches/$NGINX_VERSION.patch"
      - name: Build
        run: |
          cd nginx
          ASAN_OPTIONS=symbolize=1 ./auto/configure --with-openssl=$(pwd)/../openssl --with-openssl-opt=no-tests --add-module=$(pwd)/../nginx-ssl-fingerprint --with-http_ssl_module --with-stream_ssl_module --with-debug --with-stream --with-http_v2_module --with-http_v3_module --with-cc-opt="-fsanitize=address -O -fno-omit-frame-pointer -DNGX_DEBUG_PALLOC=1" --with-ld-opt="-L/usr/local/lib -Wl,-E -lasan"
          make -j$(nproc)
      - name: Test HTTP module
        run: |
          nohup nginx/objs/nginx -p . -c nginx-ssl-fingerprint/nginx.conf </dev/null &>nginx.log &
          sleep 2
          curl -kv https://127.0.0.1:4433
          OPENSSL_BIN=openssl/apps/openssl \
            python3 nginx-ssl-fingerprint/tests/test_fingerprint.py
          python3 nginx-ssl-fingerprint/tests/test_quic_fingerprint.py
          cat nginx.log
      - name: JA4L packet timestamp compatibility
        run: |
          ja4l_run=$(mktemp -d)
          chmod 755 "$ja4l_run"
          mkdir "$ja4l_run/logs"
          python3 - "$ja4l_run/nginx.conf" <<'PY'
          import getpass
          import sys
          from pathlib import Path

          config = Path("nginx-ssl-fingerprint/nginx.conf").read_text()
          config = config.replace("worker_processes  1;",
              "worker_processes  2;\nja4l_capture lo;\nja4l_max_flows 1;\nuser " + getpass.getuser() + ";")
          for before, after in ((4433, 19443), (4434, 19444), (4435, 19080), (4443, 19445)):
              config = config.replace(":" + str(before), ":" + str(after))
          config = config.replace("listen                 0.0.0.0:19443 ssl;",
              "listen                 0.0.0.0:19443 ssl;\n        listen [::1]:19443 ssl;")
          config = config.replace("listen                 0.0.0.0:19444 quic reuseport;",
              "listen                 0.0.0.0:19444 quic reuseport;\n        listen [::1]:19444 quic reuseport;")
          Path(sys.argv[1]).write_text(config)
          PY
          cleanup() {
            if [ -f "$ja4l_run/nginx.pid" ]; then
              sudo kill -QUIT "$(cat "$ja4l_run/nginx.pid")"
            fi
            wait "$ja4l_pid"
          }
          sudo env LSAN_OPTIONS="suppressions=$PWD/nginx-ssl-fingerprint/tests/lsan.supp" \
            "$PWD/nginx/objs/nginx" -p "$ja4l_run" -c nginx.conf > "$ja4l_run/nginx.log" 2>&1 &
          ja4l_pid=$!
          trap cleanup EXIT
          python3 - <<'PY'
          import socket
          import time
          for attempt in range(50):
              try:
                  with socket.create_connection(("127.0.0.1", 19443), timeout=0.1):
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise RuntimeError("JA4L test nginx did not start")
          PY
          ja4l_python=$(command -v python3)
          ja4l_site=$(python3 -c 'import site; print(site.getusersitepackages())')
          sudo env PYTHONPATH="$ja4l_site" "$ja4l_python" -c 'import aioquic, h2'
          for ja4l_host in 127.0.0.1 ::1; do
            sudo env PYTHONPATH="$ja4l_site" JA4L_TEST=1 NGINX_HOST="$ja4l_host" \
              NGINX_HTTP_PORT=19443 "$ja4l_python" \
              nginx-ssl-fingerprint/tests/test_fingerprint.py FingerprintTest.test_ja4l_packet_timestamps
            sudo env PYTHONPATH="$ja4l_site" JA4L_TEST=1 NGINX_HOST="$ja4l_host" \
              NGINX_HTTP3_PORT=19444 "$ja4l_python" \
              nginx-ssl-fingerprint/tests/test_quic_fingerprint.py QuicFingerprintTest.test_ja4l_quic_timestamps
          done
          sudo env PYTHONPATH="$ja4l_site" JA4L_TEST=1 NGINX_HTTP_PORT=19445 \
            "$ja4l_python" nginx-ssl-fingerprint/tests/test_fingerprint.py FingerprintTest.test_ja4l_packet_timestamps
          cleanup
          trap - EXIT
          if grep -Eq 'ERROR: AddressSanitizer|LeakSanitizer|exited with code [1-9]|exited on signal' "$ja4l_run/nginx.log"; then
            cat "$ja4l_run/nginx.log"
            exit 1
          fi
      - name: Public fingerprint compatibility
        if: >-
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
          matrix.openssl == 'openssl-4.0.3' &&
          matrix.nginx == 'release-1.31.6'
        env:
          PUBLIC_JA4_COMPAT: '1'
          PUBLIC_HTTP2_COMPAT: '1'
          PUBLIC_IANA_COMPAT: '1'
          PUBLIC_PERK_COMPAT: '1'
        run: |
          python3 nginx-ssl-fingerprint/tests/test_quic_fingerprint.py \
            FingerprintFormatTest.test_public_ja4_lookup \
            FingerprintFormatTest.test_iana_quic_transport_parameter_registry \
            FingerprintFormatTest.test_iana_http_settings_registries \
            Http2CompatibilityTest.test_public_akamai_compatibility \
            QuicFingerprintTest.test_public_perk_compatibility
      - name: Fuzzing
        run: |
          git clone https://github.com/tlsfuzzer/tlsfuzzer
          cd tlsfuzzer
          python3 -m venv venv
          venv/bin/pip install --pre tlslite-ng
          PYTHONPATH=. venv/bin/python scripts/test-client-hello-max-size.py || true
          pgrep nginx
          cd ..
          curl -kv -sSf https://127.0.0.1:4433
          curl -kv -sSf https://127.0.0.1:4443
          OPENSSL_BIN=openssl/apps/openssl \
            python3 nginx-ssl-fingerprint/tests/test_fingerprint.py
